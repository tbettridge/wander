name = "wander-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://tbettridge.github.io,http://localhost:8473,http://localhost:8474,http://127.0.0.1:8473,http://127.0.0.1:8474"
REQUESTS_PER_CLIENT_MINUTE = "30"
REQUESTS_PER_MINUTE = "1200"
DAILY_REQUEST_LIMIT = "10000"
DAILY_INPUT_BYTE_LIMIT = "32000000"
SPEECH_REQUESTS_PER_CLIENT_MINUTE = "20"
SPEECH_REQUESTS_PER_MINUTE = "600"
SPEECH_DAILY_REQUEST_LIMIT = "5000"
SPEECH_DAILY_INPUT_BYTE_LIMIT = "2000000"
# Optional map of canonical NPC IDs to designed voices accessible to the provider.
NPC_VOICES_JSON = "{}"
# Configure GEMINI_API_KEY and NPC_VOICE_BANK_JSON as secrets for designed voices.

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "AIBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AIBudget"]
