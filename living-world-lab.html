<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WANDER — Living World Lab</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #e4ece8;
      background: radial-gradient(circle at 70% 15%, #28403d, #101a1a 45%, #080c0d);
    }
    main { width: min(920px, calc(100% - 36px)); margin: 0 auto; padding: 56px 0 80px; }
    header { margin-bottom: 30px; }
    .eyebrow, .source { color: #9fb8ae; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(36px, 7vw, 72px); font-weight: 250; letter-spacing: .08em; }
    p { color: #b8c6c0; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 18px; }
    .panel { padding: 24px; border: 1px solid #52676188; border-radius: 16px; background: #111b1bcc; backdrop-filter: blur(10px); }
    h2 { margin: 10px 0; font-size: 25px; font-weight: 450; }
    #model-status { margin: 16px 0 4px; font-size: 20px; }
    #model-status[data-state="ready"] { color: #9cdbb9; }
    button, a.button {
      display: inline-block; margin: 8px 6px 0 0; padding: 10px 14px;
      border: 1px solid #789289; border-radius: 999px; color: #edf6f1;
      background: #263b36; font: inherit; text-decoration: none; cursor: pointer;
    }
    button:hover, a.button:hover { background: #36534b; }
    button:disabled { cursor: not-allowed; opacity: .4; }
    blockquote { margin: 18px 0; padding-left: 18px; border-left: 2px solid #789289; color: #d6e5de; font: 19px/1.55 Georgia, serif; }
    li { margin: 8px 0; color: #c6d5ce; }
    footer { margin-top: 18px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } main { padding-top: 32px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">On-device narrative experiment</div>
      <h1>LIVING WORLD</h1>
      <p>A safe test bench for letting Chrome's local language model plan bounded quests from real WANDER world facts.</p>
    </header>
    <div class="grid">
      <section class="panel">
        <div class="eyebrow">Chrome model</div>
        <div id="model-status" role="status">Checking…</div>
        <p id="model-detail">Inspecting this browser's capabilities.</p>
        <button id="initialize-model">Initialize on-device AI</button>
        <button id="generate-quest" disabled>Generate quest</button>
        <button id="fallback-quest">Use fallback</button>
      </section>
      <section class="panel" id="quest-output" aria-live="polite"></section>
    </div>
    <footer>
      <a class="button" href="./">Open WANDER</a>
    </footer>
  </main>
  <script type="module" src="./src/livingworldlab.js"></script>
</body>
</html>
