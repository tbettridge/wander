<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WANDER — Procedural Animal Model Sheet</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9d2c2; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; }
    #reference-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    #panel { position: fixed; top: 18px; right: 18px; z-index: 2; width: 350px; padding: 14px; border-radius: 12px; background: rgba(24, 27, 25, .91); color: #f1eee4; box-shadow: 0 8px 30px rgba(0,0,0,.22); }
    #panel h1 { margin: 0 0 11px; font-size: 13px; letter-spacing: .15em; font-weight: 650; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    button { appearance: none; border: 1px solid rgba(255,255,255,.22); border-radius: 7px; background: rgba(255,255,255,.06); color: inherit; padding: 7px 10px; cursor: pointer; }
    button:hover, button.active { background: #c47b45; border-color: #e9b17f; color: #171510; }
    .section { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); }
    .section-title { margin-bottom: 7px; color: #e3cfb8; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .control { display: grid; grid-template-columns: 77px 1fr 42px; align-items: center; gap: 7px; margin-top: 6px; font-size: 10px; }
    input[type="range"] { width: 100%; accent-color: #d68d52; }
    .value { color: #e9b17f; font-variant-numeric: tabular-nums; text-align: right; }
    #metrics { margin-top: 10px; font-size: 11px; opacity: .78; line-height: 1.55; }
    #fit-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 9px; }
    .metric { padding: 7px; border-radius: 7px; background: rgba(255,255,255,.055); }
    .metric b { display: block; color: #f4d6b7; font-size: 14px; font-variant-numeric: tabular-nums; }
    .metric span { display: block; margin-top: 1px; opacity: .58; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
    #fit-status { margin-top: 8px; color: #c8c3b7; font-size: 10px; }
    #animation-status { margin-top: 8px; color: #c8c3b7; font-size: 10px; font-variant-numeric: tabular-nums; }
    .legend { display: flex; gap: 11px; margin-top: 7px; font-size: 9px; opacity: .7; }
    .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 2px; }
    body.clean #panel { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel">
    <h1>PROCEDURAL ANIMAL MODEL SHEET</h1>
    <div class="row" id="species">
      <button data-species="fox">fox</button>
      <button data-species="whitetail">white-tail deer</button>
      <button data-species="moose">moose</button>
    </div>
    <div class="row" id="views">
      <button data-view="front">front</button>
      <button data-view="left">left side</button>
      <button data-view="back">back</button>
      <button data-view="right">right side</button>
    </div>
    <div class="section">
      <div class="section-title">Measured comparison</div>
      <div class="row" id="modes">
        <button data-mode="overlay">overlay</button>
        <button data-mode="difference">difference</button>
        <button data-mode="model">model only</button>
        <button data-mode="reference">reference</button>
      </div>
      <div class="row">
        <button id="auto-align">auto-align</button>
        <button id="toggle-guides">guides</button>
        <button id="export-comparison">export PNG</button>
      </div>
      <label class="control">opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.52"><span class="value" id="opacity-value">52%</span></label>
      <label class="control">horizontal <input id="offset-x" type="range" min="-120" max="120" step="1" value="0"><span class="value" id="offset-x-value">0px</span></label>
      <label class="control">vertical <input id="offset-y" type="range" min="-80" max="80" step="1" value="0"><span class="value" id="offset-y-value">0px</span></label>
      <label class="control">ref scale <input id="scale" type="range" min="0.85" max="1.15" step="0.002" value="1"><span class="value" id="scale-value">100%</span></label>
      <div id="fit-metrics"></div>
      <div class="legend"><span><i style="background:#14bed2"></i>model only</span><span><i style="background:#e14146"></i>reference only</span><span><i style="background:#2a2a30"></i>overlap</span></div>
      <div id="fit-status">Loading calibrated reference…</div>
    </div>
    <div class="section" id="animation-tools">
      <div class="section-title">Procedural animation</div>
      <div class="row">
        <button id="toggle-animation">play reactive gait</button>
        <button id="toggle-terrain">uneven ground</button>
      </div>
      <label class="control">speed <input id="motion-speed" type="range" min="0" max="1" step="0.01" value="0.32"><span class="value" id="motion-speed-value">32%</span></label>
      <div id="animation-status">4 planted feet · IK idle · SDF ropes settled</div>
    </div>
    <div id="metrics"></div>
  </div>
  <canvas id="reference-layer"></canvas>
  <script type="module" src="./src/animallab.js"></script>
</body>
</html>
