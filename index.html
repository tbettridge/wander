<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>WANDER — an infinite walking simulator</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8,14,20,.82), rgba(2,4,8,.94));
    color: #dfe8ee; text-align: center; cursor: pointer;
    transition: opacity .6s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: 54px; letter-spacing: 16px; font-weight: 200; margin: 0 0 6px; }
  #overlay .sub { font-size: 13px; letter-spacing: 4px; opacity: .65; margin-bottom: 38px; text-transform: uppercase; }
  #overlay .start {
    font: inherit; font-size: 17px; letter-spacing: 2px; color: inherit;
    padding: 12px 34px; border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; background: rgba(255,255,255,.025); cursor: pointer;
  }
  #overlay .start:hover, #overlay .start:focus-visible {
    background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.7);
    outline: 2px solid rgba(190,225,255,.75); outline-offset: 4px;
  }
  #overlay .controls { margin-top: 42px; font-size: 12px; line-height: 2; opacity: .55; letter-spacing: 1px; }
  #overlay .comfort {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px;
    margin-top: 18px; font-size: 12px; letter-spacing: .6px; opacity: .72;
    cursor: default;
  }
  #overlay .comfort label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  #overlay .comfort input { width: 16px; height: 16px; accent-color: #a9cce3; }
  #overlay .comfort input:focus-visible { outline: 2px solid #c3e4f7; outline-offset: 2px; }
  #overlay .xr-profile {
    display: grid; grid-template-columns: auto auto; align-items: center; gap: 5px 10px;
    margin-top: 14px; font-size: 11px; letter-spacing: .8px; opacity: .78;
    cursor: default;
  }
  #overlay .xr-profile label { text-transform: uppercase; }
  #overlay .xr-profile select {
    color: #e8f2f7; background: rgba(14,24,32,.92); border: 1px solid rgba(255,255,255,.3);
    border-radius: 5px; padding: 5px 24px 5px 8px; font: inherit; cursor: pointer;
  }
  #overlay .xr-profile select:focus-visible { outline: 2px solid #c3e4f7; outline-offset: 2px; }
  #overlay .xr-profile .note { grid-column: 1 / -1; opacity: .68; letter-spacing: .35px; }
  #overlay .status { margin-top: 26px; font-size: 12px; opacity: .5; letter-spacing: 2px; }

  #hud {
    position: fixed; top: 10px; left: 12px; z-index: 5;
    color: rgba(255,255,255,.75); font-size: 11px; letter-spacing: 1px; line-height: 1.7;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
    user-select: none;
  }
  #underwater {
    position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none;
    background: rgba(14, 50, 78, .45);
    box-shadow: inset 0 0 180px rgba(0, 20, 40, .9);
  }
  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    box-shadow: inset 0 0 220px rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: reduce) {
    #overlay { transition: none; }
  }
</style>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="vignette"></div>
  <div id="underwater"></div>
  <div id="hud"></div>
  <div id="overlay">
    <h1>WANDER</h1>
    <div class="sub">an infinite procedural world</div>
    <button class="start" id="start-button" type="button">click to walk</button>
    <div class="controls">
      W A S D — move &nbsp;·&nbsp; mouse — look &nbsp;·&nbsp; shift — stride &nbsp;·&nbsp; space — jump &nbsp;·&nbsp; esc — pause<br/>
      VR — left stick to move, right stick to turn, upper face button — jump
    </div>
    <div class="comfort" id="weather-comfort" aria-label="Weather comfort settings">
      <label><input id="gentle-rain" type="checkbox" /> gentler rain motion</label>
      <label><input id="mute-thunder" type="checkbox" /> mute thunder</label>
    </div>
    <div class="xr-profile" id="xr-profile-settings">
      <label for="xr-profile">VR rendering</label>
      <select id="xr-profile">
        <option value="painterly">Painterly</option>
        <option value="survival">Survival</option>
      </select>
      <span class="note" id="xr-profile-note">Painterly · balanced standalone VR</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">generating terrain…</div>
  </div>
  <script type="module" src="./src/main.js?v=34"></script>
</body>
</html>
